# Workflow Registry — routing source of truth for the orchestrator.
# The orchestrator reads ONLY this file to choose a route, then loads the one
# matching workflow YAML. Files prefixed `_` are non-routable and never listed here.
name: Workflow Registry
version: "1.0"
fallback: adhoc

# No concrete workflows yet — every request uses the built-in, domain-agnostic
# ad-hoc route (executor -> executor self-review).
#
# Add a workflow with the workflow-author agent, or by hand: copy `_template.yml`
# to `.claude/workflows/{id}.yml`, then append a route below, e.g.
#
#   - id: my-workflow
#     workflow: my-workflow.yml
#     description: What this workflow does
#     match: { intent: [keyword, another-keyword], priority: 50 }
#     enabled: true
routes:
  - id: proj-rules-change
    workflow: proj-rules-change.yml
    description: Change scoring, UPU eligibility, interest test, or UPU reference data (golden-test guarded)
    match: { intent: [scoring, score, formula, eligibility, upu, syarat, rule, rules, interest, question, mapping, nec, import, snapshot, epanduan, migration, data, golden], priority: 70 }
    enabled: true
  - id: proj-feature
    workflow: proj-feature.yml
    description: Build a PRD feature or roadmap phase in backend/ and/or client/
    match: { intent: [feature, phase, build, implement, endpoint, page, api, client, backend, auth, login, register, chart, explore, docker, summary], priority: 50 }
    enabled: true
