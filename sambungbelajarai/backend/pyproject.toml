[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for SambungBelajarmu.ai"
authors = [
    {name = "Nik Zulfaqar", email = "nikzulfaqar678@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "fastapi==0.115.2",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.9.2",
    "python-dotenv==1.0.1",
    "openai==1.51.0",
    "slowapi==0.1.9",
    "geopy==2.4.1",
    "httpx==0.27.2"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
